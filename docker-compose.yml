services:
  # Свой выход наружу: xray с германскими серверами из подписки.
  # Каждый локальный порт ведёт в отдельный сервер, переключение между ними
  # делает сам бот — так в /status видно, какой именно канал сейчас активный,
  # и почему выбран он.
  proxy:
    image: ghcr.io/xtls/xray-core:latest
    container_name: claude-proxy
    restart: unless-stopped
    command: ["run", "-c", "/etc/xray/config.json"]
    volumes:
      - ./proxy/xray.json:/etc/xray/config.json:ro
    ports:
      # На петлю хоста: нужно сборке образа — внутри неё имя claude-proxy
      # не резолвится, своей сети у сборки нет.
      - "127.0.0.1:10801:10801"
    networks:
      - claude

  bot:
    build: .
    container_name: claude-telegram
    restart: unless-stopped
    depends_on:
      - proxy
    env_file: .env
    volumes:
      # База и рабочие папки переживают пересборку образа.
      - ./data:/app/data
      - ./workspaces:/app/workspaces
      # Весь домашний каталог целиком, а не только .claude: настройки лежат в
      # ~/.claude.json рядом с ним, и при монтировании одной лишь папки файл
      # терялся при каждой пересборке — Claude Code ругался, что конфига нет.
      - ./claude-home:/home/claude
    ports:
      # Только на петлю: наружу мини-апп отдаёт Caddy, он же держит TLS.
      - "127.0.0.1:8788:8788"
    networks:
      - claude

networks:
  claude:
    name: claude-telegram
