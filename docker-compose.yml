# Build the worker image. The trusted controller runs as ai-bot.service.
services:
  worker-image:
    profiles: [build]
    image: ai-worker:0.159.3
    build:
      context: ./gpt
      dockerfile: Dockerfile.worker
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
