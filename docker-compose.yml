services:
  bot:
    build: .
    container_name: claude-telegram
    restart: unless-stopped
    env_file: .env
    environment:
      # На этом сервере api.anthropic.com напрямую отдаёт 403 — обязателен
      # выход через egress-proxy, тот же, которым ходят соседние проекты.
      HTTPS_PROXY: http://egress-proxy:1080
      HTTP_PROXY: http://egress-proxy:1080
      # Telegram и локальные адреса — мимо прокси.
      NO_PROXY: localhost,127.0.0.1,egress-proxy
    volumes:
      # База и рабочие папки переживают пересборку образа.
      - ./data:/app/data
      - ./workspaces:/app/workspaces
    ports:
      # Только на петлю: наружу мини-апп отдаёт Caddy, он же держит TLS.
      - "127.0.0.1:8788:8788"
    networks:
      - egress

networks:
  egress:
    # Сеть чужого проекта, в ней живёт egress-proxy. Создаётся не нами.
    name: telegram-archive_egress
    external: true
