<!doctype html>
<html lang="ru" data-page="library"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>Чаты и файлы</title><link rel="stylesheet" href="./ui.css?v=20261009-ui1"><link rel="stylesheet" href="./library.css?v=ui1"><link rel="stylesheet" href="./motion.css?v=20261009-smooth2"><script src="./telegram-web-app.js"></script><script src="./entry.js?v=20261009-unified1"></script><script src="./motion.js?v=20261009-ui1"></script><script type="module" src="./library.js?v=ui1"></script></head>
<body><main class="shell stagger">
<header class="page-header"><a id="back" class="back-link" href="./modes.html?section=home" aria-label="Назад"><svg viewBox="0 0 10 18" aria-hidden="true"><path d="M8.5 1.5 1.5 9l7 7.5"/></svg><span>Назад</span></a><p class="kicker">Моё пространство</p><h1 class="large-title">Чаты и файлы</h1></header>
<nav class="tabs segmented" aria-label="Раздел"><span class="seg-thumb" aria-hidden="true"></span><button data-tab="search" aria-pressed="true">Поиск</button><button data-tab="files" aria-pressed="false">Файлы</button><button data-tab="tasks" aria-pressed="false">Задачи</button></nav>
<section id="search" class="pane"><label for="query" class="visually-hidden">Найти в своих чатах</label><div class="search-field"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="6"/><path d="m13 13 4.5 4.5"/></svg><input id="query" type="search" placeholder="Слово, фраза или имя файла" maxlength="200" autocomplete="off" enterkeyhint="search"></div>
<section class="group filters" aria-label="Фильтры"><label class="cell select-cell"><span class="cell-title" id="engine-title">Режим</span><span class="cell-value" data-value-of="engine"></span><svg class="chev" viewBox="0 0 8 14" aria-hidden="true"><path d="M1.5 1.5 6.5 7l-5 5.5"/></svg><select id="engine" aria-labelledby="engine-title"><option value="all">GPT + Claude</option><option value="gpt">GPT</option><option value="claude">Claude</option></select></label><label class="cell select-cell"><span class="cell-title" id="kind-title">Искать в</span><span class="cell-value" data-value-of="kind"></span><svg class="chev" viewBox="0 0 8 14" aria-hidden="true"><path d="M1.5 1.5 6.5 7l-5 5.5"/></svg><select id="kind" aria-labelledby="kind-title"><option value="search">Сообщениях</option><option value="file-search">Именах файлов</option></select></label></section>
<div id="results" class="cards" aria-live="polite"><p class="empty">Введи хотя бы два символа.</p></div><button id="more" class="btn" hidden>Показать ещё</button></section>
<section id="files" class="pane" hidden><section class="group" aria-label="Диалог"><label class="cell select-cell"><span class="cell-title" id="dialog-title">Диалог</span><span class="cell-value" data-value-of="dialog"></span><svg class="chev" viewBox="0 0 8 14" aria-hidden="true"><path d="M1.5 1.5 6.5 7l-5 5.5"/></svg><select id="dialog" aria-labelledby="dialog-title"><option>Загружаю диалоги…</option></select></label></section><div class="file-actions"><button id="zip" class="btn btn-primary" disabled>Скачать ZIP</button><button id="zip-tg" class="btn" disabled>ZIP в Telegram</button></div><div id="file-list" class="cards" aria-live="polite"></div></section>
<section id="tasks" class="pane" hidden><div class="section-head"><h2>Продолжить работу</h2></div><p class="lead">История и сохранённые этапы помогут продолжить прерванную задачу.</p><div id="task-list" class="cards" aria-live="polite"></div><button id="refresh" class="btn">Обновить</button></section>
<p id="status" class="status" role="status" aria-live="polite"></p></main>
<dialog id="preview" class="sheet" aria-labelledby="filename"><div class="sheet-grabber" aria-hidden="true"></div><div class="sheet-header"><h2 id="filename"></h2><button id="close" class="icon-button" type="button" aria-label="Закрыть"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2l10 10M12 2 2 12"/></svg></button></div><div id="preview-content"></div><div class="file-actions"><button id="download" class="btn btn-primary">Скачать</button><button id="send" class="btn">В Telegram</button></div></dialog>
</body></html>
