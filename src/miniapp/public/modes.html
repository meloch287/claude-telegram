<!doctype html>
<html lang="ru" data-page="modes" data-boot data-engine="gpt">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><meta name="theme-color" content="#f2f2f6"><title>Мой бот</title><link rel="stylesheet" href="./ui.css?v=20261009-ui1"><link rel="stylesheet" href="./modes.css?v=20261009-ui1"><link rel="stylesheet" href="./loading.css?v=20261009-ui1"><link rel="stylesheet" href="./motion.css?v=20261009-smooth2"><script src="./telegram-web-app.js"></script><script src="./entry.js?v=20261009-unified1"></script><script src="./modes.js?v=20261010-voice1" defer></script><script src="./motion.js?v=20261009-ui1"></script></head>
<body>
<div class="page-loader" role="status" aria-label="Загрузка"><div class="sk sk-line"></div><div class="sk sk-title"></div><div class="sk sk-seg"></div><div class="sk sk-row"></div><div class="sk sk-group"></div><div class="sk sk-group short"></div></div>
<main class="shell page-content">
<header class="app-header"><div class="hero-copy"><p class="kicker">Моё пространство</p><h1 id="bot-title" class="large-title">Мой бот</h1></div><button id="profile-open" class="avatar" aria-label="Мой профиль"><span class="avatar-initial">Я</span><img alt="" hidden></button></header>
<div id="loading" class="loading" role="status" aria-label="Загрузка"><div class="sk sk-seg"></div><div class="sk sk-row"></div><div class="sk sk-group"></div></div>
<section id="error" class="error-card group" hidden role="alert"><h2>Не удалось открыть</h2><p id="error-text"></p><button id="retry" class="btn btn-primary">Повторить</button></section>
<div id="app" class="stagger" hidden>
<nav class="engines segmented" aria-label="Режим бота"><span class="seg-thumb" aria-hidden="true"></span><button data-engine="gpt" aria-pressed="true"><span class="logo logo-gpt" aria-hidden="true"></span><span>GPT</span></button><button data-engine="claude" aria-pressed="false"><img class="logo logo-claude" src="./claude.svg" alt=""><span>Claude</span></button></nav>
<section class="group status-card hero" aria-label="Подключение"><div class="engine-tile" aria-hidden="true"><span class="logo logo-gpt gpt-art"></span><img class="logo logo-claude claude-art" src="./claude.svg" alt=""></div><div class="status-text"><span id="engine-caption" class="status-caption">GPT · Codex</span><strong id="hero-model" class="status-model">Модель</strong></div><span class="connection" id="connection"><span></span> Подключён</span></section>
<div class="settings-card">
<div class="section-head"><h2>Настройки</h2><span id="saved" role="status">Сохранено</span></div>
<section class="group" aria-label="Настройки модели">
<label class="cell select-cell"><span class="cell-title" id="model-title">Модель</span><span class="cell-value" data-value-of="model"></span><svg class="chev" viewBox="0 0 8 14" aria-hidden="true"><path d="M1.5 1.5 6.5 7l-5 5.5"/></svg><select id="model" aria-labelledby="model-title"></select></label>
<label class="cell select-cell"><span class="cell-title" id="permission-title">Режим работы</span><span class="cell-value" data-value-of="permission"></span><svg class="chev" viewBox="0 0 8 14" aria-hidden="true"><path d="M1.5 1.5 6.5 7l-5 5.5"/></svg><select id="permission" aria-labelledby="permission-title"></select></label>
<label class="cell select-cell" id="voice-cell" hidden><span class="cell-title" id="voice-title">Ответ голосом</span><span class="cell-value" data-value-of="voice-mode"></span><svg class="chev" viewBox="0 0 8 14" aria-hidden="true"><path d="M1.5 1.5 6.5 7l-5 5.5"/></svg><select id="voice-mode" aria-labelledby="voice-title"><option value="off">Текстом</option><option value="voice">На голосовые</option><option value="always">Всегда голосом</option></select></label>
</section>
<div class="section-head"><h2 id="effort-heading">Глубина размышления</h2><span id="effort-value"></span></div>
<section class="group depth" aria-labelledby="effort-heading"><div class="depth-meter"><div id="efforts" class="efforts" role="group" aria-labelledby="effort-heading"></div><div class="depth-scale" aria-hidden="true"><span>быстрее</span><span>глубже</span></div></div><button id="effort-auto" class="cell auto-row" type="button" role="switch" aria-checked="false" hidden><span class="cell-title">Подбирать автоматически<small>Глубину выберет модель</small></span><span class="switch" aria-hidden="true"></span></button></section><div class="section-head" id="orchestration-head" hidden><h2>Агенты</h2></div><section class="group" id="orchestration-group" aria-label="Оркестрация агентами" hidden><button id="orchestration" class="cell auto-row" type="button" role="switch" aria-checked="false"><span class="cell-title">Оркестрация агентами<small id="orchestration-note">Большие задачи модель раскладывает на субагентов и перепроверяет. Тратит заметно больше лимита.</small></span><span class="switch" aria-hidden="true"></span></button></section><p class="section-foot" id="orchestration-foot" hidden>Готовые сценарии — команда /workflows в чате: /review, /plan, /audit и другие.</p>
</div>
<div class="section-head"><h2>Разделы</h2></div>
<section class="group nav-group" aria-label="Разделы">
<a id="library-link" class="cell" href="./library.html"><span class="icon-tile"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15a2 2 0 0 1-2 2H8l-4 4V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2z"/><path d="M8 9h8M8 13h5"/></svg></span><span class="cell-title">Чаты и файлы</span><svg class="chev" viewBox="0 0 8 14" aria-hidden="true"><path d="M1.5 1.5 6.5 7l-5 5.5"/></svg></a>
<a id="stats-link" class="cell" href="./index.html?section=cats"><span class="icon-tile"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-7M12 20V5M19 20v-10"/></svg></span><span class="cell-title">Статистика</span><svg class="chev" viewBox="0 0 8 14" aria-hidden="true"><path d="M1.5 1.5 6.5 7l-5 5.5"/></svg></a>
<a id="world-link" class="cell" href="./index.html?section=world"><span class="icon-tile"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c4.5 4.8 4.5 13.2 0 18-4.5-4.8-4.5-13.2 0-18"/></svg></span><span class="cell-title">Мой мир</span><svg class="chev" viewBox="0 0 8 14" aria-hidden="true"><path d="M1.5 1.5 6.5 7l-5 5.5"/></svg></a>
<button id="install" class="cell" type="button"><span class="icon-tile"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="3"/><path d="M10.5 18.5h3"/></svg></span><span class="cell-title">На главный экран</span><svg class="ext" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg></button>
<a href="./chats.html?section=admin" id="admin-link" class="cell" hidden><span class="icon-tile"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v5c0 4.4 3 8.3 7 9.5 4-1.2 7-5.1 7-9.5V6z"/><path d="m9 12 2 2 4-4"/></svg></span><span class="cell-title">Админка</span><svg class="chev" viewBox="0 0 8 14" aria-hidden="true"><path d="M1.5 1.5 6.5 7l-5 5.5"/></svg></a>
</section>
<button id="back-chat" class="btn-plain back-chat" type="button">Вернуться в чат</button>
<div class="launch-bar"><button id="open-web" class="btn btn-primary" type="button"><span>Рабочая зона</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg></button></div>
</div></main>
<dialog id="profile-dialog" class="sheet" aria-labelledby="profile-title"><div class="sheet-grabber" aria-hidden="true"></div><div class="sheet-header"><h2 id="profile-title">Мой профиль</h2><button id="profile-close" class="icon-button" type="button" aria-label="Закрыть"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2l10 10M12 2 2 12"/></svg></button></div><div class="profile-identity"><span id="profile-avatar" class="avatar large"><span class="avatar-initial">Я</span><img alt="" hidden></span><div><h3 id="profile-name"></h3><p id="profile-id"></p></div></div><button id="profile-web" class="btn btn-primary" type="button"><span>Мои устройства</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg></button></dialog>
<p id="toast" class="toast" role="status" hidden></p>
</body></html>
